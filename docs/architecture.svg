<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title description">
  <title id="title">SHAMBA SMART 360 system architecture</title>
  <desc id="description">A one-page architecture diagram showing farmer, officer and admin channels, the React PWA, Django REST API and domain apps, PostgreSQL and Redis with Celery, and Open-Meteo and SMS or voice integrations with feedback loops.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1 1 11 6 1 11Z" fill="#1B4D1E"/>
    </marker>
    <marker id="arrow-light" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1 1 11 6 1 11Z" fill="#F6F3EA"/>
    </marker>
    <style>
      .title { font: 700 40px Fraunces, Georgia, serif; fill: #F6F3EA; }
      .subtitle { font: 400 17px Poppins, Arial, sans-serif; fill: #E8F0E2; }
      .lane { font: 500 13px "IBM Plex Mono", Consolas, monospace; letter-spacing: 1.4px; fill: #1B4D1E; }
      .head { font: 600 19px Fraunces, Georgia, serif; fill: #17140A; }
      .body { font: 400 14px Poppins, Arial, sans-serif; fill: #17140A; }
      .small { font: 400 12px Poppins, Arial, sans-serif; fill: #17140A; }
      .reverse { fill: #F6F3EA; }
      .badge { font: 500 11px "IBM Plex Mono", Consolas, monospace; fill: #F6F3EA; }
    </style>
  </defs>
  <rect width="1600" height="1000" fill="#F6F3EA"/>
  <rect width="1600" height="150" fill="#1B4D1E"/>
  <path d="M0 148H1600" stroke="#5B8C3A" stroke-width="5"/>
  <text x="74" y="72" class="title">SHAMBA SMART 360</text>
  <text x="76" y="111" class="subtitle">Local farm intelligence · mobile-first · Kisii County</text>
  <rect x="1310" y="52" width="216" height="38" rx="19" fill="#9E2012"/>
  <text x="1340" y="77" class="badge">SYSTEM OVERVIEW</text>

  <text x="74" y="198" class="lane">PEOPLE &amp; CHANNELS</text>
  <rect x="74" y="220" width="270" height="118" rx="18" fill="#FFFFFF" stroke="#D8DDCF" stroke-width="2"/>
  <text x="99" y="255" class="head">Farmers</text>
  <text x="99" y="282" class="body">Smartphone PWA · basic phone</text>
  <text x="99" y="307" class="small">English · Kiswahili · Ekegusii*</text>
  <rect x="74" y="360" width="270" height="96" rx="18" fill="#FFFFFF" stroke="#D8DDCF" stroke-width="2"/>
  <text x="99" y="396" class="head">Officers &amp; county admins</text>
  <text x="99" y="424" class="body">Ward tools · county dashboard</text>

  <text x="418" y="198" class="lane">CLIENT APPLICATION</text>
  <rect x="418" y="220" width="346" height="236" rx="20" fill="#FFFFFF" stroke="#5B8C3A" stroke-width="3"/>
  <rect x="418" y="220" width="346" height="48" rx="20" fill="#5B8C3A"/>
  <path d="M418 249v19h346v-19" fill="#5B8C3A"/>
  <text x="445" y="252" class="head reverse">React · TypeScript · Vite</text>
  <text x="445" y="302" class="body">Farmer experience · role dashboards</text>
  <text x="445" y="331" class="body">React Query · Axios · i18n</text>
  <text x="445" y="360" class="body">Installable PWA · service worker</text>
  <text x="445" y="389" class="body">IndexedDB cache &amp; offline outbox</text>
  <text x="445" y="427" class="small">Offline queue is user-scoped and syncs online</text>

  <text x="832" y="198" class="lane">API &amp; DOMAIN SERVICES</text>
  <rect x="832" y="220" width="380" height="236" rx="20" fill="#FFFFFF" stroke="#1B4D1E" stroke-width="3"/>
  <rect x="832" y="220" width="380" height="48" rx="20" fill="#1B4D1E"/>
  <path d="M832 249v19h380v-19" fill="#1B4D1E"/>
  <text x="859" y="252" class="head reverse">Django REST Framework</text>
  <text x="859" y="302" class="body">JWT · role-based permissions · CORS</text>
  <text x="859" y="331" class="body">Accounts · farms · weather · alerts</text>
  <text x="859" y="360" class="body">Advice · pests · market · academy · waste</text>
  <text x="859" y="389" class="body">Gateway · analytics · OpenAPI schema</text>
  <text x="859" y="427" class="small">Ward scope for officers · own data for farmers</text>

  <text x="1280" y="198" class="lane">DATA &amp; JOBS</text>
  <rect x="1280" y="220" width="246" height="104" rx="18" fill="#17140A"/>
  <text x="1306" y="259" class="head reverse">PostgreSQL</text>
  <text x="1306" y="289" class="body reverse">Farm &amp; service records</text>
  <rect x="1280" y="350" width="246" height="106" rx="18" fill="#9E2012"/>
  <text x="1306" y="389" class="head reverse">Redis · Celery</text>
  <text x="1306" y="419" class="body reverse">Scheduled &amp; async work</text>

  <path d="M344 280h66" fill="none" stroke="#1B4D1E" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M344 408h66" fill="none" stroke="#1B4D1E" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M764 338h60" fill="none" stroke="#1B4D1E" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1212 278h60" fill="none" stroke="#1B4D1E" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1212 408h60" fill="none" stroke="#1B4D1E" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="775" y="322" class="small">HTTPS / JSON</text>

  <text x="74" y="525" class="lane">INTEGRATIONS &amp; FEEDBACK LOOP</text>
  <rect x="74" y="554" width="430" height="174" rx="20" fill="#FFFFFF" stroke="#D8DDCF" stroke-width="2"/>
  <text x="104" y="594" class="head">External data &amp; messaging</text>
  <rect x="104" y="617" width="154" height="48" rx="12" fill="#EAF1E5"/>
  <text x="124" y="647" class="body">Open-Meteo</text>
  <rect x="278" y="617" width="190" height="48" rx="12" fill="#FCE7E3"/>
  <text x="296" y="647" class="body">SMS · voice provider</text>
  <text x="104" y="699" class="small">Forecast ingestion · configurable sender adapters</text>

  <rect x="568" y="554" width="486" height="174" rx="20" fill="#1B4D1E"/>
  <text x="600" y="594" class="head reverse">Celery Beat schedules</text>
  <text x="600" y="628" class="body reverse">Weather refresh · every 6 hours</text>
  <text x="600" y="656" class="body reverse">Rules evaluation · every 3 hours</text>
  <text x="600" y="684" class="body reverse">Weekly Academy tip · scheduled</text>

  <rect x="1118" y="554" width="408" height="174" rx="20" fill="#FFFFFF" stroke="#D8DDCF" stroke-width="2"/>
  <text x="1150" y="594" class="head">Farmer feedback</text>
  <text x="1150" y="628" class="body">HELPFUL · NOT_RELEVANT</text>
  <text x="1150" y="656" class="body">Delivery history · rule tuning</text>
  <text x="1150" y="699" class="small">Feedback informs local alert relevance</text>

  <path d="M1285 456v58h-40v30" fill="none" stroke="#1B4D1E" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1280 324h-45v200H810v24" fill="none" stroke="#1B4D1E" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M504 642h54" fill="none" stroke="#1B4D1E" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1054 642h54" fill="none" stroke="#1B4D1E" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1320 554v-63H594v-27" fill="none" stroke="#1B4D1E" stroke-width="2.5" stroke-dasharray="8 7" marker-end="url(#arrow)"/>

  <rect x="74" y="790" width="1452" height="124" rx="20" fill="#17140A"/>
  <text x="108" y="833" class="head reverse">Core safeguards</text>
  <text x="108" y="867" class="body reverse">Private role-scoped records</text>
  <text x="470" y="867" class="body reverse">SMS consent &amp; message limits</text>
  <text x="860" y="867" class="body reverse">Offline actions remain reviewable</text>
  <text x="1240" y="867" class="body reverse">Demo data labelled</text>
  <text x="108" y="894" class="small reverse">* Ekegusii translations are a draft pending native-speaker review. Pest matching is guidance, not diagnosis.</text>
</svg>
